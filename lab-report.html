<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab Report Generator – MedLib</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0a2942; }
    .lab-header {
      background: linear-gradient(135deg, #0a2942, #0f766e);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .lab-header a { color: #7dd3d8; text-decoration: none; font-size: 0.85rem; }
    .lab-header h1 { color: white; font-size: 1.1rem; flex: 1; }
    .lab-frame {
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="lab-header">
    <a href__="/">← Back to MedLib</a>
    <h1>🧪 AI Lab Report Generator</h1>
    <a href__="https://lab-draft-flow.base44.app" target="_blank">Open Full Screen ↗</a>
  </div>
  <iframe
    class="lab-frame"
    src="https://lab-draft-flow.base44.app"
    allow="clipboard-write"
    title="Lab Report Generator"
  ></iframe>
  <script>
  // Auto-close any new tab opened from the iframe (Base44 badge)
  window.addEventListener('message', function(e) {
    // catch postMessage from iframe if any
  });

  // Monitor for new windows opened by the iframe
  const frame = document.querySelector('iframe');
  if (frame) {
    frame.addEventListener('load', function() {
      try {
        // Intercept clicks inside iframe that open new tabs
        const iframeDoc = frame.contentDocument || frame.contentWindow.document;
        iframeDoc.addEventListener('click', function(e) {
          const link = e.target.closest('a[target="_blank"]');
          if (link && link.href.includes('base44')) {
            e.preventDefault();
            const popup = window.open(link.href, '_blank');
            if (popup) setTimeout(() => popup.close(), 100);
          }
        }, true);
      } catch(e) {
        // cross-origin blocks this — see note below
      }
    });
  }
</script>
</body>
</html>
