<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Smart Flashcards · MedLib</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 384 512'%3E%3Cpath fill='%232c7cb0' d='M192 32c0-17.7-14.3-32-32-32s-32 14.3-32 32v25.6C69.5 68.4 16 127.1 16 200v32c0 101.7 82.3 184 184 184h64c101.7 0 184-82.3 184-184v-32c0-72.9-53.5-131.6-128-142.4V32c0-17.7-14.3-32-32-32s-32 14.3-32 32v16H192V32zM48 200c0-63.1 48-115.4 109.5-126.9 4.2-.7 8.5-1.1 12.8-1.1h31.5c4.3 0 8.6 .4 12.8 1.1C288 84.6 336 136.9 336 200v32c0 75.1-60.9 136-136 136h-64c-75.1 0-136-60.9-136-136v-32zm320 240c0-8.8-7.2-16-16-16H32c-8.8 0-16 7.2-16 16v48c0 8.8 7.2 16 16 16h320c8.8 0 16-7.2 16-16v-48z'/%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d1f2c;
            --glass: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.08);
            --text: #e8f0f8;
            --muted: #8ab4d0;
            --primary: #00d4b0;
            --primary-glow: rgba(0, 212, 176, 0.3);
            --secondary: #3b82f6;
            --radius: 1.2rem;
            --shadow: 0 8px 32px rgba(0,0,0,0.2);
            --card-border: rgba(0, 212, 176, 0.15);
        }
        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0;
            margin: 0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .page-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: var(--muted);
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
            opacity: 0.8;
        }

        /* --- Create Deck & Search (unchanged from previous) --- */
        .create-deck {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .create-deck input {
            flex: 1;
            min-width: 200px;
            padding: 0.7rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .create-deck input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .create-deck input::placeholder {
            color: var(--muted);
        }

        .btn {
            padding: 0.7rem 1.6rem;
            border: none;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #00a88a);
            color: #fff;
            border: none;
            box-shadow: 0 0 30px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px var(--primary-glow);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.08);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
        }
        .btn-danger {
            background: rgba(255,70,70,0.15);
            border-color: rgba(255,70,70,0.2);
            color: #ff7a7a;
        }
        .btn-danger:hover {
            background: rgba(255,70,70,0.25);
        }
        .btn-sm {
            padding: 0.25rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 2rem;
        }
        .btn-success {
            background: rgba(0,220,120,0.12);
            border-color: rgba(0,220,120,0.2);
            color: #66eeaa;
        }
        .btn-success:hover { background: rgba(0,220,120,0.2); }
        .btn-warning {
            background: rgba(255,200,0,0.1);
            border-color: rgba(255,200,0,0.15);
            color: #f0d060;
        }
        .btn-warning:hover { background: rgba(255,200,0,0.2); }
        .btn-nexus {
            background: rgba(150,80,255,0.12);
            border-color: rgba(150,80,255,0.2);
            color: #c090ff;
        }
        .btn-nexus:hover { background: rgba(150,80,255,0.2); }

        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .search-bar input {
            flex: 1;
            padding: 0.6rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* --- Folders & Tree (unchanged) --- */
        .folders-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .folder-container {
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius);
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            transition: border-color 0.3s;
        }
        .folder-container.drag-over {
            border-color: var(--primary);
            background: rgba(0, 212, 176, 0.03);
        }
        .folder-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.2rem 0.2rem 0.6rem 0.2rem;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid transparent;
        }
        .folder-header:hover {
            border-bottom-color: rgba(255,255,255,0.05);
        }
        .folder-header .folder-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #c0dcec;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .folder-header .folder-name i {
            color: var(--primary);
            width: 1.4rem;
            text-align: center;
        }
        .folder-header .folder-actions {
            display: flex;
            gap: 0.4rem;
        }
        .folder-body {
            display: none;
            padding-top: 0.6rem;
            padding-left: 0.3rem;
            border-left: 2px solid rgba(0, 212, 176, 0.08);
            margin-left: 1.2rem;
        }
        .folder-body.open {
            display: block;
        }
        .folder-empty {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 0.4rem 0;
            font-style: italic;
            opacity: 0.6;
        }

        .deck-tree {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .deck-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            transition: background 0.2s, border-color 0.2s;
            cursor: default;
            gap: 0.5rem;
        }
        .deck-item:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.05);
        }
        .deck-item.dragging {
            opacity: 0.4;
            transform: scale(0.96);
        }
        .deck-item.drag-over {
            border-color: var(--primary);
            background: rgba(0, 212, 176, 0.04);
        }
        .deck-item .deck-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            min-width: 140px;
        }
        .deck-item .deck-toggle {
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--muted);
            transition: 0.2s;
            width: 1.4rem;
            text-align: center;
        }
        .deck-item .deck-toggle:hover {
            color: var(--primary);
        }
        .deck-item .deck-icon {
            color: var(--primary);
            opacity: 0.6;
            font-size: 0.9rem;
        }
        .deck-item .deck-info {
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            flex: 1;
        }
        .deck-item .deck-name {
            font-weight: 500;
            font-size: 0.95rem;
            color: #dce8f0;
        }
        .deck-item .deck-meta {
            font-size: 0.75rem;
            color: var(--muted);
            opacity: 0.7;
        }
        .deck-item .deck-actions {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .deck-item .child-decks {
            padding-left: 1.6rem;
            border-left: 2px solid rgba(0, 212, 176, 0.05);
            margin-top: 0.3rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .deck-item .child-decks.collapsed {
            display: none;
        }

        /* --- CARD – FULL WIDTH, FIXED HEIGHT, NO SHIFT --- */
        .practice-container {
            max-width: 100%;
        }
        .card-flip {
            perspective: 1200px;
            margin: 1.5rem 0;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            transform-origin: center center;
            /* Height will be set by JavaScript to the max of front/back */
            min-height: 260px;
        }
        .card-inner.flipped {
            transform: rotateX(180deg);
        }
        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            backface-visibility: hidden;
            border-radius: 2rem;
            padding: 2.5rem 2.8rem;
            background: linear-gradient(145deg, rgba(20, 40, 60, 0.75), rgba(10, 25, 40, 0.85));
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 48px rgba(0,0,0,0.3), 0 0 40px rgba(0,212,176,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            line-height: 1.8;
            color: #f0f8ff;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: center;
            overflow-y: auto;  /* fallback for very long text */
        }
        .card-face:hover {
            box-shadow: 0 16px 56px rgba(0,0,0,0.4), 0 0 50px rgba(0,212,176,0.08);
        }
        .card-face.back {
            transform: rotateX(180deg);
            background: linear-gradient(145deg, rgba(0, 40, 70, 0.75), rgba(0, 20, 50, 0.85));
            border-color: rgba(59, 130, 246, 0.2);
        }
        .card-face .card-label {
            position: absolute;
            top: 1.2rem;
            left: 1.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.2);
        }
        .card-face .card-text {
            margin-top: 0.5rem;
            width: 100%;
        }
        .card-face .click-hint {
            margin-top: 1.8rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
        }
        .card-face .nexus-btn-area {
            margin-top: 1.5rem;
        }

        .rating-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 2rem;
        }
        .rating-btn {
            padding: 0.6rem 1.8rem;
            border: none;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.04);
            color: #d0e0e8;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .rating-btn:hover { transform: scale(1.06); }
        .rating-btn:active { transform: scale(0.94); }
        .rating-btn.again { background: rgba(255,60,60,0.12); border-color: rgba(255,60,60,0.2); color: #ff7a7a; }
        .rating-btn.again:hover { background: rgba(255,60,60,0.2); }
        .rating-btn.hard { background: rgba(255,200,0,0.08); border-color: rgba(255,200,0,0.15); color: #f0d060; }
        .rating-btn.hard:hover { background: rgba(255,200,0,0.15); }
        .rating-btn.good { background: rgba(0,220,120,0.08); border-color: rgba(0,220,120,0.15); color: #66eeaa; }
        .rating-btn.good:hover { background: rgba(0,220,120,0.15); }
        .rating-btn.easy { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.15); color: #6bb4ff; }
        .rating-btn.easy:hover { background: rgba(59,130,246,0.15); }

        .practice-stats {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--muted);
        }
        .empty-state i {
            font-size: 2.5rem;
            opacity: 0.2;
            margin-bottom: 0.8rem;
        }
        .empty-state h3 {
            font-weight: 400;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.8);
            backdrop-filter: blur(12px);
            color: #e0e8f0;
            padding: 0.6rem 1.8rem;
            border-radius: 3rem;
            font-size: 0.9rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid rgba(0, 212, 176, 0.12);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; }

        @keyframes shake {
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-10px)}
            40%{transform:translateX(10px)}
            60%{transform:translateX(-6px)}
            80%{transform:translateX(6px)}
        }
        .shake { animation: shake 0.4s ease; }
        @keyframes pop {
            0%{transform:scale(0.5);opacity:0}
            80%{transform:scale(1.06)}
            100%{transform:scale(1);opacity:1}
        }
        .pop { animation: pop 0.4s ease; }
        @keyframes confetti-fall {
            0%{opacity:1;transform:translateY(0) rotate(0deg)}
            100%{opacity:0;transform:translateY(100px) rotate(360deg)}
        }
        .confetti-piece {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 1000;
            animation: confetti-fall 1s ease-out forwards;
        }

        @media (max-width: 700px) {
            .glass-panel { padding: 1rem; }
            .create-deck { flex-direction: column; align-items: stretch; }
            .create-deck input { width: 100%; }
            .deck-item { flex-direction: column; align-items: stretch; gap: 0.3rem; }
            .deck-item .deck-actions { justify-content: flex-start; }
            .folder-header { flex-direction: column; align-items: stretch; gap: 0.4rem; }
            .folder-header .folder-actions { justify-content: flex-start; }
            .rating-buttons .rating-btn { flex: 1; }
            .card-face { font-size: 1.1rem; padding: 1.8rem 1.5rem; min-height: 180px; }
            .card-inner { min-height: 180px; }
            .btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
        }
        @media (max-width: 480px) {
            .container { padding: 0.8rem 0.5rem; }
            .glass-panel { border-radius: 1rem; padding: 0.8rem; }
            .card-face { font-size: 1rem; padding: 1.5rem 1rem; min-height: 150px; }
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://js.puter.com/v2/"></script>
<script src="nexus.js"></script>
<script>
    (function() {
        'use strict';

        // ---------- STATE ----------
        let decks = {};
        let folders = {};
        let currentView = 'list';
        let currentDeckId = null;
        let currentCardIndex = 0;
        let dueCards = [];
        let isFlipped = false;
        let isGenerating = false;
        const STORAGE_KEY = 'medlib_flashcards';
        const FOLDER_KEY = 'medlib_folders';
        let expanded = { folders: {}, decks: {} };

        // ---------- TOAST ----------
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ---------- STORAGE ----------
        function loadData() {
            try {
                const decksData = localStorage.getItem(STORAGE_KEY);
                if (decksData) {
                    decks = JSON.parse(decksData);
                    Object.keys(decks).forEach(id => {
                        if (!decks[id].cards) decks[id].cards = [];
                        if (!decks[id].topic) decks[id].topic = decks[id].name;
                        if (decks[id].parentId === undefined) decks[id].parentId = null;
                        if (decks[id].children === undefined) decks[id].children = [];
                        if (decks[id].folderId === undefined) decks[id].folderId = null;
                    });
                } else {
                    decks = {};
                }
            } catch (e) { decks = {}; }

            try {
                const foldersData = localStorage.getItem(FOLDER_KEY);
                if (foldersData) {
                    folders = JSON.parse(foldersData);
                    Object.keys(folders).forEach(id => {
                        if (!folders[id].deckIds) folders[id].deckIds = [];
                    });
                } else {
                    folders = {};
                }
            } catch (e) { folders = {}; }

            // Clean up
            Object.keys(folders).forEach(fid => {
                folders[fid].deckIds = folders[fid].deckIds.filter(did => decks[did]);
            });
            Object.values(decks).forEach(d => {
                if (!d.children) d.children = [];
                if (d.parentId === undefined) d.parentId = null;
                if (d.folderId === undefined) d.folderId = null;
                d.children = d.children.filter(cid => decks[cid]);
                if (d.parentId && !decks[d.parentId]) d.parentId = null;
                if (d.parentId && d.folderId) {
                    if (folders[d.folderId]) {
                        folders[d.folderId].deckIds = folders[d.folderId].deckIds.filter(id => id !== d.id);
                    }
                    d.folderId = null;
                }
            });

            Object.keys(folders).forEach(fid => {
                folders[fid].deckIds = folders[fid].deckIds.filter(did => {
                    const d = decks[did];
                    return d && d.parentId === null;
                });
            });

            if (Object.keys(decks).length === 0) {
                const sampleDeck = {
                    id: 'deck_sample',
                    name: 'Cardiology Basics',
                    topic: 'Cardiology',
                    created: Date.now(),
                    parentId: null,
                    children: [],
                    folderId: null,
                    cards: [
                        { id: 'c1', front: 'What is the first-line treatment for stable angina?', back: 'Nitroglycerin (sublingual)', easeFactor: 2.5, interval: 1, nextReview: Date.now(), reviewCount: 0 },
                        { id: 'c2', front: 'What is the mechanism of ACE inhibitors?', back: 'Block conversion of angiotensin I to angiotensin II, reducing vasoconstriction and aldosterone.', easeFactor: 2.5, interval: 1, nextReview: Date.now(), reviewCount: 0 }
                    ]
                };
                decks[sampleDeck.id] = sampleDeck;
                const folderId = 'folder_' + Date.now();
                folders[folderId] = { name: 'Cardiology', deckIds: [sampleDeck.id] };
                expanded.folders[folderId] = true;
                saveData();
            }

            Object.keys(folders).forEach(fid => { if (expanded.folders[fid] === undefined) expanded.folders[fid] = true; });
            Object.keys(decks).forEach(did => { if (expanded.decks[did] === undefined) expanded.decks[did] = true; });
            saveData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(decks));
            localStorage.setItem(FOLDER_KEY, JSON.stringify(folders));
        }

        // ---------- SOUND EFFECTS ----------
        function playTone(freq, duration, type='sine') {
            try {
                const ctx = new(window.AudioContext||window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime+duration);
            } catch(e){}
        }
        function playSuccess(){ playTone(880,0.15); setTimeout(()=>playTone(1100,0.1),120); }
        function playFail(){ playTone(300,0.3,'sawtooth'); }
        function playFlip(){ playTone(600,0.05); }
        function fireConfetti() {
            const emojis = ['🎉','✨','⭐','🌟','🎊','💪','🏆'];
            for(let i=0;i<12;i++){
                setTimeout(()=>{
                    const el=document.createElement('div');
                    el.className='confetti-piece';
                    el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
                    el.style.left=(Math.random()*80+10)+'%';
                    el.style.top=(Math.random()*40+30)+'%';
                    el.style.fontSize=(1.5+Math.random()*2)+'rem';
                    document.body.appendChild(el);
                    setTimeout(()=>el.remove(),1200);
                }, i*80);

        // ---------- AI ----------
        let cachedModelId = null;
        async function getBestModel() {
            if (cachedModelId) return cachedModelId;
            try {
                if (!window.puter?.ai) {
                    for (let i=0;i<5;i++){ await new Promise(r=>setTimeout(r,1000)); if(window.puter?.ai) break; }
                }
                if (!window.puter?.ai) throw new Error('Puter AI not loaded');
                const models = await puter.ai.listModels();
                const preferred = ['gpt-5.4-nano','google/gemini-3.1-flash-lite','google/gemini-2.5-flash-lite-001','google/gemini-2.0-flash-lite-001'];
                for (const p of preferred) {
                    if (models.some(m=>m.id===p)) { cachedModelId=p; return cachedModelId; }
                }
                const gemini = models.find(m=>m.id.toLowerCase().includes('gemini'));
                if (gemini) { cachedModelId=gemini.id; return cachedModelId; }
                if (models.length) { cachedModelId=models[0].id; return cachedModelId; }
                throw new Error('No chat models');
            } catch(e) {
                console.warn(e);
                cachedModelId='gpt-5.4-nano';
                return cachedModelId;
            }
        }

        function getFallbackCards(topic) {
            const lower = topic.toLowerCase();
            if (lower.includes('cardio')) {
                return [
                    { front: 'What is the first-line treatment for stable angina?', back: 'Nitroglycerin (sublingual)' },
                    { front: 'What is the mechanism of ACE inhibitors?', back: 'Block conversion of angiotensin I to angiotensin II, reducing vasoconstriction and aldosterone.' },
                    { front: 'What is the most common cause of heart failure?', back: 'Ischemic heart disease' },
                    { front: 'What is the hallmark ECG finding in pericarditis?', back: 'Diffuse ST-segment elevation' },
                    { front: 'What is the first-line medication for acute decompensated heart failure?', back: 'Loop diuretics' }
                ];
            } else if (lower.includes('pharma')||lower.includes('drug')) {
                return [
                    { front: 'Mechanism of beta-blockers?', back: 'Block beta-adrenergic receptors, reducing heart rate and contractility.' },
                    { front: 'Antidote for heparin overdose?', back: 'Protamine sulfate' },
                    { front: 'Mechanism of statins?', back: 'HMG-CoA reductase inhibitors.' },
                    { front: 'First-line treatment for hypertension in diabetics?', back: 'ACE inhibitors' },
                    { front: 'Mechanism of metformin?', back: 'Decreases hepatic glucose production and increases insulin sensitivity.' }
                ];
            } else {
                return [
                    { front: 'What is the first-line treatment for stable angina?', back: 'Nitroglycerin' },
                    { front: 'What is the mechanism of beta-blockers?', back: 'Block beta-adrenergic receptors' },
                    { front: 'Most common cause of community-acquired pneumonia?', back: 'Streptococcus pneumoniae' },
                    { front: 'Hallmark of type 1 diabetes?', back: 'Autoimmune destruction of beta cells, absolute insulin deficiency.' },
                    { front: 'First-line treatment for acute anaphylaxis?', back: 'Epinephrine (IM)' }
                ];
            }
        }

        // ---------- GENERATE DECK ----------
        async function generateDeck(topic, folderId = null, parentId = null) {
            if (isGenerating) return;
            if (!topic || topic.trim().length<2) { showToast('Please enter a valid topic.'); return; }
            isGenerating = true;
            renderView();

            const prompt = `You are a medical educator. Generate 8 unique, high‑yield flashcards about the topic: "${topic.trim()}".
        Each flashcard must be distinct – cover different subtopics, mechanisms, drugs, or clinical pearls.
        Format the output as a JSON array of objects with fields:
          - "front": the question or prompt,
          - "back": the answer or explanation.
        Do not include any extra text or markdown. Only the JSON array.`;

            try {
                const model = await getBestModel();
                const timeoutPromise = new Promise((_,reject)=>setTimeout(()=>reject(new Error('AI request timed out')),30000));
                const aiPromise = puter.ai.chat(prompt, { model });
                const raw = await Promise.race([aiPromise, timeoutPromise]);
                let text = raw.message?.content || raw.content || raw;
                let jsonMatch = text.match(/\[[\s\S]*\]/);
                if (jsonMatch) text = jsonMatch[0];
                text = text.replace(/```json/g,'').replace(/```/g,'').trim();
                let cards = JSON.parse(text);
                if (!Array.isArray(cards) || cards.length===0) throw new Error('No cards generated');
                if (cards.length>10) cards=cards.slice(0,10);

                const deckId = 'deck_'+Date.now();
                const deck = {
                    id: deckId,
                    name: topic.trim(),
                    topic: topic.trim(),
                    created: Date.now(),
                    parentId: parentId || null,
                    children: [],
                    folderId: folderId || null,
                    cards: cards.map((c,i)=>({
                        id: 'card_'+deckId+'_'+i,
                        front: c.front,
                        back: c.back,
                        easeFactor: 2.5,
                        interval: 1,
                        nextReview: Date.now(),
                        reviewCount: 0
                    }))
                };
                decks[deckId] = deck;
                if (parentId && decks[parentId]) {
                    if (!decks[parentId].children.includes(deckId)) {
                        decks[parentId].children.push(deckId);
                    }
                }
                if (folderId && folders[folderId]) {
                    folders[folderId].deckIds.push(deckId);
                }
                expanded.decks[deckId] = true;
                if (parentId) expanded.decks[parentId] = true;
                saveData();
                showToast(`✅ Generated ${cards.length} flashcards for "${topic}"!`);
                isGenerating = false;
                startPractice(deckId);
            } catch(e) {
                console.error('Generation error:', e);
                showToast('⚠️ AI generation failed. Using fallback cards.');
                const fallbackCards = getFallbackCards(topic);
                const deckId = 'deck_fallback_'+Date.now();
                const deck = {
                    id: deckId,
                    name: topic.trim()+' (fallback)',
                    topic: topic.trim(),
                    created: Date.now(),
                    parentId: parentId || null,
                    children: [],
                    folderId: folderId || null,
                    cards: fallbackCards.map((c,i)=>({
                        id: 'card_'+deckId+'_'+i,
                        front: c.front,
                        back: c.back,
                        easeFactor: 2.5,
                        interval: 1,
                        nextReview: Date.now(),
                        reviewCount: 0
                    }))
                };
                decks[deckId] = deck;
                if (parentId && decks[parentId]) {
                    if (!decks[parentId].children.includes(deckId)) {
                        decks[parentId].children.push(deckId);
                    }
                }
                if (folderId && folders[folderId]) {
                    folders[folderId].deckIds.push(deckId);
                }
                expanded.decks[deckId] = true;
                if (parentId) expanded.decks[parentId] = true;
                saveData();
                showToast(`📚 Created fallback deck with ${fallbackCards.length} cards.`);
                isGenerating = false;
                startPractice(deckId);
            } finally {
                isGenerating = false;
            }
        }

        // ---------- START PRACTICE ----------
        function startPractice(deckId) {
            currentDeckId = deckId;
            currentCardIndex = 0;
            currentView = 'practice';
            renderView();
        }

        // ---------- DELETE DECK (recursive) ----------
        function deleteDeck(deckId) {
            const deck = decks[deckId];
            if (!deck) return;
            if (!confirm(`Delete deck "${deck.name}" and all its sub-decks?`)) return;
            const deleteRecursive = (id) => {
                const d = decks[id];
                if (!d) return;
                if (d.parentId && decks[d.parentId]) {
                    decks[d.parentId].children = decks[d.parentId].children.filter(cid => cid !== id);
                }
                if (d.folderId && folders[d.folderId]) {
                    folders[d.folderId].deckIds = folders[d.folderId].deckIds.filter(did => did !== id);
                }
                d.children.forEach(cid => deleteRecursive(cid));
                delete decks[id];
                delete expanded.decks[id];
            };
            deleteRecursive(deckId);
            saveData();
            if (currentDeckId === deckId) { currentDeckId = null; currentView = 'list'; }
            renderView();
        }

        // ---------- SPACED REPETITION ----------
        function getDueCards(deck) {
            const now = Date.now();
            return deck.cards.filter(c=>c.nextReview <= now);
        }

        function updateCard(cardId, rating, deckId) {
            const deck = decks[deckId];
            if (!deck) return;
            const card = deck.cards.find(c=>c.id===cardId);
            if (!card) return;

            let interval = card.interval || 1;
            let ease = card.easeFactor || 2.5;

            switch(rating) {
                case 'again': interval=0.02; ease=Math.max(1.3,ease-0.2); playFail(); break;
                case 'hard': interval*=1.2; ease=Math.max(1.3,ease-0.15); playFail(); break;
                case 'good': interval*=ease; ease+=0.1; playSuccess(); break;
                case 'easy': interval*=ease*1.3; ease+=0.15; playSuccess(); fireConfetti(); break;
            }
            if (interval<0.01) interval=0.01;
            if (interval>365) interval=365;

            card.interval = interval;
            card.easeFactor = ease;
            card.nextReview = Date.now() + (interval*86400000);
            card.reviewCount = (card.reviewCount||0)+1;
            saveData();
        }

        // ---------- FOLDERS ----------
        function createFolder(name) {
            if (!name || name.trim()==='') return;
            const id = 'folder_'+Date.now();
            folders[id] = { name: name.trim(), deckIds: [] };
            expanded.folders[id] = true;
            saveData();
            renderView();
            showToast(`📁 Folder "${name.trim()}" created. Drag decks here.`);
        }

        function deleteFolder(folderId) {
            if (!confirm(`Delete folder "${folders[folderId]?.name}" and move its decks to "Uncategorized"?`)) return;
            const folder = folders[folderId];
            if (folder) {
                folder.deckIds.forEach(did => {
                    if (decks[did]) decks[did].folderId = null;
                });
                delete folders[folderId];
                delete expanded.folders[folderId];
                saveData();
                renderView();
            }
        }

        function renameFolder(folderId, newName) {
            if (!newName || newName.trim()==='') return;
            if (folders[folderId]) {
                folders[folderId].name = newName.trim();
                saveData();
                renderView();
            }
        }

        function toggleFolder(folderId) {
            expanded.folders[folderId] = !expanded.folders[folderId];
            renderView();
        }

        function moveDeckToFolder(deckId, folderId) {
            const deck = decks[deckId];
            if (!deck) return;
            if (deck.parentId) {
                showToast('Cannot move a sub‑deck to a folder. Remove it from its parent first.');
                return;
            }
            if (deck.folderId && folders[deck.folderId]) {
                folders[deck.folderId].deckIds = folders[deck.folderId].deckIds.filter(id=>id!==deckId);
            }
            if (folderId && folders[folderId]) {
                if (!folders[folderId].deckIds.includes(deckId)) {
                    folders[folderId].deckIds.push(deckId);
                }
                deck.folderId = folderId;
            } else {
                deck.folderId = null;
            }
            saveData();
            renderView();
        }

        // ---------- NEST / UNNEST ----------
        function nestDeck(childId, parentId) {
            if (childId === parentId) return;
            const child = decks[childId];
            const parent = decks[parentId];
            if (!child || !parent) return;

            let isDescendant = false;
            let check = parent;
            while (check) {
                if (check.id === childId) { isDescendant = true; break; }
                check = check.parentId ? decks[check.parentId] : null;
            }
            if (isDescendant) {
                showToast('Cannot nest a deck inside its own descendant.');
                return;
            }

            if (child.parentId && decks[child.parentId]) {
                decks[child.parentId].children = decks[child.parentId].children.filter(id => id !== childId);
            }
            if (child.folderId && folders[child.folderId]) {
                folders[child.folderId].deckIds = folders[child.folderId].deckIds.filter(id => id !== childId);
                child.folderId = null;
            }
            child.parentId = parentId;
            if (!parent.children.includes(childId)) {
                parent.children.push(childId);
            }
            expanded.decks[parentId] = true;
            saveData();
            renderView();
            showToast(`📚 "${child.name}" nested under "${parent.name}".`);
        }

        function unnestDeck(deckId) {
            const deck = decks[deckId];
            if (!deck || !deck.parentId) return;
            const oldParent = decks[deck.parentId];
            if (oldParent) {
                oldParent.children = oldParent.children.filter(id => id !== deckId);
            }
            deck.parentId = null;
            saveData();
            renderView();
            showToast(`"${deck.name}" moved to root level.`);
        }

        // ---------- DRAG & DROP ----------
        let draggedDeckId = null;

        function handleDragStart(e, deckId) {
            draggedDeckId = deckId;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', deckId);
            setTimeout(() => {
                const el = e.target.closest('.deck-item');
                if (el) el.classList.add('dragging');
            }, 0);
        }

        function handleDragEnd(e) {
            const el = e.target.closest('.deck-item');
            if (el) el.classList.remove('dragging');
            document.querySelectorAll('.folder-container, .deck-item').forEach(el => el.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const y = e.clientY;
            const threshold = 80;
            const container = document.querySelector('.container');
            if (container) {
                const rect = container.getBoundingClientRect();
                if (y - rect.top < threshold) window.scrollBy(0, -20);
                else if (rect.bottom - y < threshold) window.scrollBy(0, 20);
            }
            document.querySelectorAll('.folder-container, .deck-item').forEach(el => el.classList.remove('drag-over'));
            const folder = e.target.closest('.folder-container');
            const deckItem = e.target.closest('.deck-item');
            if (folder) folder.classList.add('drag-over');
            else if (deckItem) deckItem.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            const el = e.target.closest('.folder-container') || e.target.closest('.deck-item');
            if (el) el.classList.remove('drag-over');
        }

        function handleDrop(e, targetId, type) {
            e.preventDefault();
            e.stopPropagation();
            document.querySelectorAll('.folder-container, .deck-item').forEach(el => el.classList.remove('drag-over'));
            const sourceId = e.dataTransfer.getData('text/plain');
            if (!sourceId || !decks[sourceId]) return;

            if (type === 'folder') {
                moveDeckToFolder(sourceId, targetId);
                showToast(`Moved "${decks[sourceId]?.name}" to folder "${folders[targetId]?.name || 'Uncategorized'}"`);
            } else if (type === 'deck') {
                nestDeck(sourceId, targetId);
            }
        }

        // ---------- ASK NEXUS ----------
        function askNexus(text) {
            if (typeof window.sendMessage === 'function') {
                let input = document.getElementById('nexus-input');
                if (!input) {
                    const panel = document.querySelector('.nexus-panel');
                    if (panel) input = panel.querySelector('textarea');
                    if (!input) { showToast('Nexus not ready. Open Nexus first.'); return; }
                }
                input.value = `Explain more about: ${text}`;
                const panel = document.querySelector('.nexus-panel');
                if (panel && panel.style.display !== 'flex') panel.style.display = 'flex';
                window.sendMessage(input.value);
            } else {
                showToast('Nexus AI not loaded. Please refresh.');
            }
        }

        // ---------- EXPORT HTML ----------
        function exportDeckHTML(deckId) {
            const deck = decks[deckId];
            if (!deck) { showToast('Deck not found.'); return; }
            let html = `<html><head><style>body{font-family:sans-serif;max-width:800px;margin:2rem auto;} .card{border:1px solid #ddd;border-radius:8px;padding:1rem;margin-bottom:1rem;} .front{font-weight:bold;} .back{margin-top:0.5rem;color:#333;} .deck-title{font-size:2rem;margin-bottom:1rem;}</style></head><body><h1 class="deck-title">${deck.name}</h1>`;
            deck.cards.forEach(c => {
                html += `<div class="card"><div class="front">${c.front}</div><div class="back">${c.back}</div></div>`;
            });
            html += '</body></html>';
            const blob = new Blob([html], {type:'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${deck.name.replace(/\s+/g,'_')}.html`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exported as HTML (printable).');
        }

        // ---------- ADD MORE CARDS ----------
        window.addMoreCards = function(deckId) {
            const deck = decks[deckId];
            if (!deck) { showToast('Deck not found.'); return; }
            const existingFronts = deck.cards.map(c=>c.front);
            if (isGenerating) return;
            isGenerating = true;
            renderView();
            const topic = deck.topic || deck.name;
            const avoidText = `\nAvoid these existing concepts: ${existingFronts.join(', ')}.`;
            const prompt = `You are a medical educator. Generate 5 unique, high‑yield flashcards about the topic: "${topic}".
        Each flashcard must be distinct – cover different subtopics.
        Format as JSON array: [{"front":"...","back":"..."}]
        ${avoidText}`;
            (async () => {
                try {
                    const model = await getBestModel();
                    const raw = await puter.ai.chat(prompt, { model });
                    let text = raw.message?.content || raw.content || raw;
                    let jsonMatch = text.match(/\[[\s\S]*\]/);
                    if (jsonMatch) text = jsonMatch[0];
                    text = text.replace(/```json/g,'').replace(/```/g,'').trim();
                    let cards = JSON.parse(text);
                    if (!Array.isArray(cards) || cards.length===0) throw new Error('No cards');
                    const startIdx = deck.cards.length;
                    cards.forEach((c,i)=>{
                        deck.cards.push({
                            id: 'card_'+deckId+'_'+(startIdx+i),
                            front: c.front,
                            back: c.back,
                            easeFactor: 2.5,
                            interval: 1,
                            nextReview: Date.now(),
                            reviewCount: 0
                        });
                    });
                    saveData();
                    showToast(`✅ Added ${cards.length} new cards to "${deck.name}"!`);
                    isGenerating = false;
                    renderView();
                } catch(e) {
                    console.error(e);
                    showToast('Failed to add cards. Using fallback.');
                    const fb = getFallbackCards(topic).slice(0,3);
                    const startIdx = deck.cards.length;
                    fb.forEach((c,i)=>{
                        deck.cards.push({
                            id: 'card_'+deckId+'_'+(startIdx+i),
                            front: c.front,
                            back: c.back,
                            easeFactor: 2.5,
                            interval: 1,
                            nextReview: Date.now(),
                            reviewCount: 0
                        });
                    });
                    saveData();
                    showToast(`Added ${fb.length} fallback cards.`);
                    isGenerating = false;
                    renderView();
                }
            })();
        };

        // ---------- RENDER ----------
        function renderView() {

        // ---------- RENDER LIST ----------
        function renderList(app) {
            let html = `
                <div class="glass-panel">
                    <h1 class="page-title"><i class="fas fa-brain"></i> Smart Flashcards</h1>
                    <p class="subtitle">AI‑powered flashcards with spaced repetition – drag a deck onto another to nest it, or onto a folder to categorise.</p>
                    <div class="create-deck">
                        <input type="text" id="topic-input" placeholder="Enter topic (e.g., Cardiology)" />
                        <button class="btn btn-primary" id="generate-btn"><i class="fas fa-magic"></i> Generate Deck</button>
                        <button class="btn btn-secondary" onclick="window.createFolder(prompt('Folder name:'))"><i class="fas fa-folder-plus"></i> New Folder</button>
                    </div>
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="🔍 Search decks or cards..." oninput="window.updateSearch(this.value)" />
                        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('search-input').value='';window.updateSearch('');"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="folders-grid" id="folders-grid">
            `;

            const searchTerm = (document.getElementById('search-input')?.value || '').toLowerCase();

            function deckMatches(deckId) {
                const d = decks[deckId];
                if (!d) return false;
                const match = d.name.toLowerCase().includes(searchTerm) ||
                              d.topic.toLowerCase().includes(searchTerm) ||
                              d.cards.some(c => c.front.toLowerCase().includes(searchTerm) || c.back.toLowerCase().includes(searchTerm));
                if (match) return true;
                return d.children.some(cid => deckMatches(cid));
            }

            const topLevelDecks = Object.keys(decks).filter(id => decks[id].parentId === null);

            const folderIds = Object.keys(folders);
            const visibleFolderIds = folderIds.filter(fid => {
                const folder = folders[fid];
                const hasVisible = folder.deckIds.some(did => deckMatches(did) && decks[did]?.parentId === null);
                return folder.deckIds.length === 0 || hasVisible;
            });

            const uncategorizedIds = topLevelDecks.filter(id => {
                const d = decks[id];
                return !d.folderId && deckMatches(id);
            });

            visibleFolderIds.forEach(fid => {
                const folder = folders[fid];
                const deckIdsInFolder = folder.deckIds.filter(did => deckMatches(did) && decks[did]?.parentId === null);
                const isExpanded = expanded.folders[fid] !== false;
                html += `
                    <div class="folder-container" 
                         draggable="false"
                         ondrop="window.handleDrop(event, '${fid}', 'folder')" 
                         ondragover="window.handleDragOver(event)" 
                         ondragleave="window.handleDragLeave(event)">
                        <div class="folder-header" onclick="window.toggleFolder('${fid}')">

                                <i class="fas ${isExpanded ? 'fa-folder-open' : 'fa-folder'}"></i> ${escapeHtml(folder.name)}
                                <span style="font-size:0.8rem;color:var(--muted);margin-left:0.5rem;">${deckIdsInFolder.length}</span>
                            </span>
                            <div class="folder-actions" onclick="event.stopPropagation();">
                                <button class="btn btn-secondary btn-sm" onclick="window.renameFolder('${fid}', prompt('New folder name:', '${escapeHtml(folder.name)}'))"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="window.deleteFolder('${fid}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="folder-body ${isExpanded ? 'open' : ''}">
                            ${deckIdsInFolder.length === 0 ? '<div class="folder-empty">Drop decks here</div>' : ''}
                            <div class="deck-tree">
                                ${deckIdsInFolder.map(did => renderDeckTree(did)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (uncategorizedIds.length > 0) {
                const isExpanded = expanded.folders['uncategorized'] !== false;
                html += `
                    <div class="folder-container" 
                         draggable="false"
                         ondrop="window.handleDrop(event, null, 'folder')" 
                         ondragover="window.handleDragOver(event)" 
                         ondragleave="window.handleDragLeave(event)">
                        <div class="folder-header" onclick="window.toggleFolder('uncategorized')">
                            <span class="folder-name">
                                <i class="fas ${isExpanded ? 'fa-folder-open' : 'fa-folder'}"></i> Uncategorized
                                <span style="font-size:0.8rem;color:var(--muted);margin-left:0.5rem;">${uncategorizedIds.length}</span>
                            </span>
                        </div>
                        <div class="folder-body ${isExpanded ? 'open' : ''}">
                            <div class="deck-tree">
                                ${uncategorizedIds.map(did => renderDeckTree(did)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (visibleFolderIds.length === 0 && uncategorizedIds.length === 0) {
                html += `<div class="empty-state"><i class="fas fa-layer-group"></i><h3>No decks found</h3><p>Create a deck or adjust your search.</p></div>`;
            }

            html += `</div></div>`;
            app.innerHTML = html;

            document.getElementById('generate-btn').addEventListener('click', ()=>{
                const topic = document.getElementById('topic-input').value.trim();
                if (topic) { generateDeck(topic, null, null); document.getElementById('topic-input').value=''; }
                else showToast('Please enter a topic.');
            });
            document.getElementById('topic-input').addEventListener('keypress', e=>{ if(e.key==='Enter') document.getElementById('generate-btn').click(); });
        }

        // Recursive deck tree render
        function renderDeckTree(deckId) {
            const deck = decks[deckId];
            if (!deck) return '';
            const due = getDueCards(deck).length;
            const total = deck.cards.length;
            const hasChildren = deck.children.length > 0;
            const isExpanded = expanded.decks[deckId] !== false;
            const childHtml = hasChildren ? `
                <div class="child-decks ${isExpanded ? '' : 'collapsed'}">
                    ${deck.children.map(cid => renderDeckTree(cid)).join('')}
                </div>
            ` : '';

            return `
                <div class="deck-item" draggable="true" 
                     ondragstart="window.handleDragStart(event, '${deckId}')" 
                     ondragend="window.handleDragEnd(event)"
                     ondrop="window.handleDrop(event, '${deckId}', 'deck')"
                     ondragover="window.handleDragOver(event)"
                     ondragleave="window.handleDragLeave(event)">
                    <div class="deck-left">
                        ${hasChildren ? `<span class="deck-toggle" onclick="event.stopPropagation(); window.toggleDeck('${deckId}')"><i class="fas ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i></span>` : '<span style="width:1.4rem;"></span>'}
                        <span class="deck-icon"><i class="fas fa-book"></i></span>
                        <div class="deck-info">
                            <div class="deck-name">${escapeHtml(deck.name)}</div>
                            <div class="deck-meta">${total} cards · ${due} due</div>
                        </div>
                    </div>
                    <div class="deck-actions">
                        <button class="btn btn-primary btn-sm" onclick="window.startPractice('${deckId}')"><i class="fas fa-play"></i></button>
                        <button class="btn btn-warning btn-sm" onclick="window.addMoreCards('${deckId}')"><i class="fas fa-plus"></i></button>
                        ${deck.parentId ? `<button class="btn btn-secondary btn-sm" onclick="window.unnestDeck('${deckId}')"><i class="fas fa-level-up-alt"></i></button>` : ''}
                        <button class="btn btn-secondary btn-sm" onclick="window.exportDeckHTML('${deckId}')"><i class="fas fa-print"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="window.deleteDeck('${deckId}')"><i class="fas fa-trash"></i></button>
                    </div>
                    ${childHtml}
                </div>
            `;
        }

        window.toggleDeck = function(deckId) {
            expanded.decks[deckId] = !expanded.decks[deckId];
            renderView();
        };

        // ---------- PRACTICE (FULL WIDTH, FIXED HEIGHT, NO SHIFT) ----------
        function renderPractice(app) {
            const deck = decks[currentDeckId];
            if (!deck) { currentView='list'; renderView(); return; }

            let available = getDueCards(deck);
            if (available.length===0) {
                if (deck.cards.length<15) {
                    app.innerHTML = `
                        <div class="glass-panel" style="text-align:center;padding:2rem;">
                            <i class="fas fa-check-circle" style="color:#66eeaa;font-size:2.5rem;opacity:0.6;display:block;margin-bottom:0.8rem;"></i>
                            <h3 style="font-weight:400;">All caught up!</h3>
                            <p style="color:var(--muted);">Want to learn more about "${escapeHtml(deck.name)}"?</p>
                            <div style="display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;">
                                <button class="btn btn-success" onclick="window.addMoreCards('${currentDeckId}')"><i class="fas fa-plus"></i> Add More</button>
                                <button class="btn btn-secondary" onclick="window.goToDeckList()">Back to Decks</button>
                            </div>
                        </div>
                    `;
                    return;
                } else {
                    app.innerHTML = `
                        <div class="glass-panel" style="text-align:center;padding:2rem;">
                            <i class="fas fa-check-circle" style="color:#66eeaa;font-size:2.5rem;opacity:0.6;display:block;margin-bottom:0.8rem;"></i>
                            <h3 style="font-weight:400;">All caught up!</h3>
                            <p style="color:var(--muted);">Come back later for spaced repetition.</p>
                            <button class="btn btn-primary" onclick="window.goToDeckList()">Back to Decks</button>
                        </div>
                    `;
                    return;
                }
            }

            available.sort((a,b)=>a.nextReview-b.nextReview);
            dueCards = available;
            if (currentCardIndex>=dueCards.length) currentCardIndex=0;
            const card = dueCards[currentCardIndex];
            if (!card) { currentView='list'; renderView(); return; }

            const total = dueCards.length;
            const idx = currentCardIndex+1;
            const progress = Math.round((currentCardIndex/total)*100);

            app.innerHTML = `
                <div class="glass-panel practice-container">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                        <button class="btn btn-secondary btn-sm" onclick="window.goToDeckList()"><i class="fas fa-arrow-left"></i> Decks</button>
                        <span class="practice-stats">${idx} / ${total} · ${progress}%</span>
                    </div>
                    <h2 style="font-size:1.3rem;font-weight:500;color:var(--muted);margin-bottom:0.2rem;">${escapeHtml(deck.name)}</h2>
                    <div class="card-flip" id="card-flip">
                        <div class="card-inner" id="card-inner">
                            <div class="card-face front">
                                <span class="card-label">Front</span>
                                <div class="card-text">${escapeHtml(card.front)}</div>
                                <div class="nexus-btn-area">
                                    <button class="btn btn-nexus btn-sm" onclick="event.stopPropagation(); window.askNexus('${escapeHtml(card.front)}')">
                                        <i class="fas fa-robot"></i> Ask Nexus
                                    </button>
                                </div>
                                <div class="click-hint"><i class="fas fa-hand-pointer"></i> Tap to flip</div>
                            </div>
                            <div class="card-face back">
                                <span class="card-label">Back</span>
                                <div class="card-text">${escapeHtml(card.back)}</div>
                                <div class="nexus-btn-area">
                                    <button class="btn btn-nexus btn-sm" onclick="event.stopPropagation(); window.askNexus('${escapeHtml(card.back)}')">
                                        <i class="fas fa-robot"></i> Ask Nexus
                                    </button>
                                </div>
                                <div class="click-hint">Tap again to flip back</div>
                            </div>
                        </div>
                    </div>
                    <div id="rating-area" style="display:none;">
                        <div class="rating-buttons">
                            <button class="rating-btn again" data-rating="again">🔄 Again</button>
                            <button class="rating-btn hard" data-rating="hard">😓 Hard</button>
                            <button class="rating-btn good" data-rating="good">👍 Good</button>
                            <button class="rating-btn easy" data-rating="easy">🚀 Easy</button>
                        </div>
                    </div>
                </div>
            `;

            // --- FIX: Lock the container height to the taller of the two faces ---
            function lockCardHeight() {
                const inner = document.getElementById('card-inner');
                if (!inner) return;
                const front = inner.querySelector('.card-face.front');
                const back = inner.querySelector('.card-face.back');
                if (!front || !back) return;
                // Temporarily set both to auto height to measure
                front.style.height = 'auto';
                back.style.height = 'auto';
                const frontH = front.scrollHeight;
                const backH = back.scrollHeight;
                const maxH = Math.max(frontH, backH, 260);
                // Set the container to that height
                inner.style.height = maxH + 'px';
                // Now set faces to fill that container
                front.style.height = '100%';
                back.style.height = '100%';
            }

            // Run after render and on resize
            setTimeout(lockCardHeight, 20);
            window.addEventListener('resize', lockCardHeight);

            const flipEl = document.getElementById('card-flip');
            const innerEl = document.getElementById('card-inner');
            let flipped = false;
            const ratingArea = document.getElementById('rating-area');

            flipEl.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                flipped = !flipped;
                innerEl.classList.toggle('flipped', flipped);
                if (flipped) {
                    playFlip();
                    ratingArea.style.display = 'block';
                } else {
                    ratingArea.style.display = 'none';
                }
            });

            document.querySelectorAll('.rating-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const rating = btn.dataset.rating;
                    if (rating === 'again') {
                        innerEl.classList.add('shake');
                        setTimeout(()=>innerEl.classList.remove('shake'),500);
                    } else if (rating === 'easy') {
                        innerEl.classList.add('pop');
                        setTimeout(()=>innerEl.classList.remove('pop'),500);
                    }
                    updateCard(card.id, rating, currentDeckId);
                    currentCardIndex++;
                    if (currentCardIndex>=dueCards.length) {
                        renderView();
                    } else {
                        renderPractice(app);
                    }
                });
            });
        }

        // ---------- HELPERS ----------
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        // ---------- GLOBAL EXPOSURES ----------
        window.startPractice = startPractice;
        window.goToDeckList = function() {
            currentView='list';
            currentDeckId=null;
            currentCardIndex=0;
            renderView();
        };
        window.deleteDeck = deleteDeck;
        window.generateDeck = generateDeck;
        window.addMoreCards = window.addMoreCards;
        window.askNexus = askNexus;
        window.exportDeckHTML = exportDeckHTML;
        window.createFolder = createFolder;
        window.deleteFolder = deleteFolder;
        window.renameFolder = renameFolder;
        window.toggleFolder = toggleFolder;
        window.moveDeckToFolder = moveDeckToFolder;
        window.nestDeck = nestDeck;
        window.unnestDeck = unnestDeck;
        window.handleDragStart = handleDragStart;
        window.handleDragEnd = handleDragEnd;
        window.handleDragOver = handleDragOver;
        window.handleDragLeave = handleDragLeave;
        window.handleDrop = handleDrop;
        window.updateSearch = function() { renderView(); };
        window.toggleDeck = window.toggleDeck;

        // ---------- INIT ----------
        loadData();
        renderView();

    })();
</script>
</body>
</html>
